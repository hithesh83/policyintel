# ==============================================================================
# PolicyIntel AI Enterprise Stack - Local Multi-Container Environment
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL (Relational Database)
  # Purpose: Document metadata, query telemetry, feedback logs.
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: policyintel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: policy_user
      POSTGRES_PASSWORD: policy_password
      POSTGRES_DB: policyintel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U policy_user -d policyintel_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - policyintel_network

  # ----------------------------------------------------------------------------
  # 2. Qdrant (Vector DB)
  # Purpose: Storing hierarchical policy embeddings & metadata payloads.
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: policyintel_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - policyintel_network

  # ----------------------------------------------------------------------------
  # 3. Neo4j (Knowledge Graph DB)
  # Purpose: Graph storing schemes, clauses, amendments, & superseding relationships.
  # ----------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.15-community
    container_name: policyintel_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/policy_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p policy_password 'RETURN 1;' || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - policyintel_network

  # ----------------------------------------------------------------------------
  # 4. Backend (FastAPI Application Service)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: policyintel_backend
    restart: on-failure
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_USER: policy_user
      POSTGRES_PASSWORD: policy_password
      POSTGRES_DB: policyintel_db
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: policy_password
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./data:/app/data
    networks:
      - policyintel_network

  # ----------------------------------------------------------------------------
  # 5. Frontend (Next.js 14 App Router UI)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: policyintel_frontend
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - policyintel_network

# ==============================================================================
# Custom Bridge Network
# ==============================================================================
networks:
  policyintel_network:
    driver: bridge
    name: policyintel_network

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
