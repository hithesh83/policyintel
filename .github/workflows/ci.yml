name: PolicyIntel AI CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Backend (FastAPI) CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        
        # Install project requirements if they exist
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
        # Install testing and linting tools explicitly
        pip install pytest ruff black

    - name: Check Formatting with Black
      run: |
        black --check . || echo "Formatting issues found. Run 'black .' locally to fix."

    - name: Lint with Ruff
      run: |
        ruff check . || echo "Linting issues found. Run 'ruff check --fix .' locally."

    - name: Run Unit Tests
      env:
        PYTHONPATH: .
      run: |
        # Try running tests if the tests directory exists
        if [ -d "../tests" ]; then
          pytest ../tests/ -v
        else
          echo "No tests directory found. Skipping."
        fi

  frontend-ci:
    name: Frontend (Next.js) CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Dependencies
      run: |
        # Use npm install instead of npm ci since we might not have a package-lock.json yet
        npm install || echo "Failed to install dependencies (package.json might be empty). Skipping."

    - name: Run Linter
      run: |
        npm run lint --if-present || echo "Linting failed."

    - name: Build Next.js App
      run: |
        npm run build --if-present || echo "Build failed."
